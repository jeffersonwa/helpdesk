name: Deploy (produção)

# Entrega contínua para o servidor de produção (csc.nitecnologia.tec.br).
#
# Dispara APÓS o workflow "CI" concluir com sucesso na branch main. Assim, só
# publicamos código que passou em lint + typecheck + testes + build.
#
# Estratégia: build da imagem no runner do GitHub → push para o GitHub
# Container Registry (GHCR) → SSH no servidor → `docker compose pull` + `up -d`.
# O servidor NÃO compila nada (build isolado e reprodutível no CI).
#
# --------------------------------------------------------------------------
# SECRETS necessários no repositório (Settings → Secrets and variables → Actions):
#   SSH_HOST            IP/host do servidor (ex.: 148.113.236.231)
#   SSH_USER            usuário SSH (ex.: rocky)
#   SSH_PRIVATE_KEY     chave PRIVADA dedicada ao deploy (NÃO reutilizar chaves
#                       pessoais; gerar um par só para o Actions e autorizar a
#                       pública no ~/.ssh/authorized_keys do servidor)
#   SSH_PORT            (opcional) porta SSH; default 22
#   DEPLOY_DIR          diretório do compose no servidor (ex.: /opt/helpdesk)
#
# O GHCR usa o GITHUB_TOKEN automático (permissão `packages: write`), não
# precisa de secret extra para o push. O servidor faz `docker login ghcr.io`
# com um token de leitura — ver a etapa de deploy.
#
# PRÉ-REQUISITOS no servidor (feitos uma única vez, ver docs/deploy.md):
#   - Docker + docker compose plugin instalados.
#   - Diretório $DEPLOY_DIR com: docker-compose.prod.yml e o arquivo .env de
#     produção (fora do git, com os segredos reais).
#   - Proxy reverso com TLS para csc.nitecnologia.tec.br (Traefik/nginx) — a
#     definição depende do que já roda no servidor; ver docs/deploy.md.
# --------------------------------------------------------------------------

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, push (GHCR) e deploy via SSH
    runs-on: ubuntu-latest
    # Só prossegue se o CI que disparou este run tiver terminado em sucesso.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Uma imagem por serviço (app e worker são targets diferentes do Dockerfile).
      - name: Build & push imagem do app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.IMAGE }}-app:latest
            ${{ env.IMAGE }}-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push imagem do worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          tags: |
            ${{ env.IMAGE }}-worker:latest
            ${{ env.IMAGE }}-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sincroniza o compose de produção com a versão do repositório ANTES de
      # subir, para que mudanças de orquestração (serviços, deps, redes) valham
      # sem edição manual no servidor. O `.env` NÃO é tocado (segredos ficam só
      # no servidor).
      - name: Copia docker-compose.prod.yml para o servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: docker-compose.prod.yml
          target: ${{ secrets.DEPLOY_DIR }}
          overwrite: true

      - name: Deploy no servidor via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_DIR }}"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export IMAGE_TAG="${{ github.sha }}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
