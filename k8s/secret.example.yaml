# TEMPLATE de Secret — JÁ Helpdesk (tarefa 36.3).
#
# ⚠️  ESTE É UM MODELO. NÃO contém segredos reais e NÃO deve ser aplicado como
#     está em produção. Todos os valores são PLACEHOLDERS (Req. 18.5).
#
# Em produção, NÃO versione segredos em texto plano. Prefira:
#   - External Secrets Operator (sincroniza de AWS Secrets Manager / Vault / GCP),
#   - Sealed Secrets (Bitnami) — cifra o Secret para poder versioná-lo com segurança,
#   - ou o secret manager do provedor via CSI Secrets Store.
#
# O Deployment do `app` e do `worker` referenciam este Secret via `envFrom`.
apiVersion: v1
kind: Secret
metadata:
  name: helpdesk-secrets
  labels:
    app.kubernetes.io/part-of: helpdesk
type: Opaque
stringData:
  # --- OBRIGATÓRIOS (o app não inicia sem eles — Req. 18.6) ---
  DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/helpdesk?schema=public"
  NEXTAUTH_SECRET: "REPLACE_WITH_openssl_rand_base64_32"

  # --- Fila / cache ---
  REDIS_URL: "redis://helpdesk-redis:6379"

  # --- WhatsApp (Meta Cloud API oficial) ---
  WHATSAPP_APP_SECRET: "REPLACE_WITH_META_APP_SECRET"
  WHATSAPP_VERIFY_TOKEN: "REPLACE_WITH_WEBHOOK_VERIFY_TOKEN"
  WHATSAPP_ACCESS_TOKEN: "REPLACE_WITH_PERMANENT_ACCESS_TOKEN"
  WHATSAPP_PHONE_NUMBER_ID: "REPLACE_WITH_PHONE_NUMBER_ID"

  # --- E-mail / formulário público ---
  RESEND_WEBHOOK_SECRET: "REPLACE_WITH_RESEND_WEBHOOK_SECRET"
  TURNSTILE_SECRET_KEY: "REPLACE_WITH_TURNSTILE_SECRET_KEY"

  # --- Object storage de mídia (credenciais) ---
  MEDIA_S3_ACCESS_KEY_ID: "REPLACE_WITH_S3_ACCESS_KEY_ID"
  MEDIA_S3_SECRET_ACCESS_KEY: "REPLACE_WITH_S3_SECRET_ACCESS_KEY"
---
# Exemplo (comentado) de como o mesmo Secret seria provisionado por External
# Secrets, mantendo os valores fora do Git:
#
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: helpdesk-secrets
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: vault-backend
#     kind: ClusterSecretStore
#   target:
#     name: helpdesk-secrets
#   dataFrom:
#     - extract:
#         key: helpdesk/production
