# docker-compose de PRODUÇÃO — JÁ Helpdesk.
#
# Consome as imagens JÁ construídas e publicadas no GHCR pelo workflow de
# deploy. O servidor não compila nada — apenas `pull` + `up -d`.
#
# Uso no servidor (feito pelo deploy.yml):
#   IMAGE_TAG=<sha> docker compose -f docker-compose.prod.yml up -d
# (se IMAGE_TAG ausente, cai para :latest.)
#
# SEGREDOS (Req. 18.5): nenhum valor literal aqui. Tudo vem do `.env` de
# produção no servidor (git-ignored) via `env_file`.
#
# TLS / domínio: https://csc.nitecnologia.tec.br
#
# ---------------------------------------------------------------------------
# PROXY: cenário A — Traefik JÁ EXISTENTE no servidor (compartilhado).
# ---------------------------------------------------------------------------
# O servidor 148.113.236.231 já roda um Traefik central (container `traefik`)
# ocupando 80/443, servindo vários sistemas de clientes. NÃO subimos outro
# proxy. O `app` entra na rede externa `proxy_network` (a do Traefik) e é
# roteado por labels. Config real do Traefik existente:
#   - entrypoints: web (:80) e websecure (:443); web já redireciona p/ websecure
#   - certresolver: letsencrypt (ACME TLS-ALPN)
#   - provider docker com exposedbydefault=false (por isso as labels abaixo)
#
# postgres/redis/worker ficam numa rede `internal` privada, sem exposição.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - internal

  app:
    image: ${IMAGE:-ghcr.io/jeffersonwa/helpdesk}-app:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - internal
      - proxy
    labels:
      - "traefik.enable=true"
      # O app é alcançado pelo Traefik através da rede proxy_network.
      - "traefik.docker.network=proxy_network"
      - "traefik.http.routers.helpdesk.rule=Host(`csc.nitecnologia.tec.br`)"
      - "traefik.http.routers.helpdesk.entrypoints=websecure"
      - "traefik.http.routers.helpdesk.tls=true"
      - "traefik.http.routers.helpdesk.tls.certresolver=letsencrypt"
      - "traefik.http.services.helpdesk.loadbalancer.server.port=3000"
      # HTTP→HTTPS já é feito globalmente pelo Traefik existente (entrypoint web
      # com redirection.to=websecure), então não declaramos rota HTTP aqui.

  worker:
    image: ${IMAGE:-ghcr.io/jeffersonwa/helpdesk}-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres-data:
  redis-data:

networks:
  # Rede interna privada: postgres/redis/worker/app, sem exposição externa.
  internal:
    driver: bridge
  # Rede de borda do Traefik JÁ EXISTENTE (externa, criada fora deste compose).
  proxy:
    external: true
    name: proxy_network
